name: veil-link

on:
  push:
    paths:
      - "labs/veil-link/**"
      - ".github/workflows/veil-link.yml"
  pull_request:
    paths:
      - "labs/veil-link/**"
      - ".github/workflows/veil-link.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: labs/veil-link
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo clippy -- -D warnings
